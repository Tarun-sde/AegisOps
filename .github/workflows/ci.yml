name: AegisOps CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.1'
      - name: Frozen dependencies
        run: |
          python -m pip install uv==0.13.0
          npm install --global npm@10.9.8
          uv sync --frozen --all-groups
          npm ci
          npx playwright install --with-deps chromium
      - name: Static checks
        run: make check
      - name: Offline tests and ADK artifacts
        run: |
          make test
          make spike
      - name: Dependency security
        run: |
          uv run --frozen --all-groups pip-audit --progress-spinner off
          npm audit --audit-level=high
      - name: Isolated browser, production build, and scheduler gate
        run: |
          make browser
      - name: Isolated Compose verification
        run: |
          python -c "import secrets; from pathlib import Path; Path('.env').write_text('POSTGRES_PASSWORD=' + secrets.token_urlsafe(32) + '\n')"
          make build
          make integration
          make up
          make migrate
          curl --fail http://127.0.0.1:8000/readyz
          curl --fail http://127.0.0.1:3000/healthz
          curl --fail http://127.0.0.1:3001/healthz
      - name: Stop task services
        if: always()
        env:
          POSTGRES_PASSWORD: ci-cleanup-placeholder
        run: |
          docker compose --profile core --profile lab down
          docker compose -p aegisops-verify -f docker-compose.yml -f docker-compose.verify.yml --profile verify down
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: phase0-synthetic-spikes
          path: |
            artifacts/spike-*.json
            artifacts/aegisops-browser-*/
          if-no-files-found: ignore
