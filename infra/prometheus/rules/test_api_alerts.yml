rule_files:
  - api_alerts.yml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      # Scenario 1: Low volume (volume guard prevents false alert)
      - series: 'http_requests_total{service="shop-api",route="/checkout",status_code="500"}'
        values: '0 1 1 1'
      - series: 'http_requests_total{service="shop-api",route="/checkout",status_code="201"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 45s
        alertname: HighApiErrorRate
        exp_alerts: []

  - interval: 15s
    input_series:
      # Scenario 2: Healthy traffic (no 5xx errors)
      - series: 'http_requests_total{service="shop-api",route="/checkout",status_code="201"}'
        values: '0 20 40 60 80 100 120'
      - series: 'http_requests_total{service="shop-api",route="/checkout",status_code="500"}'
        values: '0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: HighApiErrorRate
        exp_alerts: []

  - interval: 15s
    input_series:
      # Scenario 3: Elevated 5xx ratio -> fires, then recovers -> resolves
      - series: 'http_requests_total{service="shop-api",route="/checkout",status_code="201"}'
        values: '0 20 40 60 70 80 90 100 120 140 160'
      - series: 'http_requests_total{service="shop-api",route="/checkout",status_code="500"}'
        values: '0 0 0 0 30 60 90 120 120 120 120'
    alert_rule_test:
      - eval_time: 45s
        alertname: HighApiErrorRate
        exp_alerts: []
      - eval_time: 1m45s
        alertname: HighApiErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
              service: shop-api
              route: /checkout
              environment: demo
            exp_annotations:
              summary: "High 5xx error rate on shop-api route /checkout"
              description: "Service shop-api route /checkout has 5xx error ratio above 20% over 1m."
      - eval_time: 2m30s
        alertname: HighApiErrorRate
        exp_alerts: []
