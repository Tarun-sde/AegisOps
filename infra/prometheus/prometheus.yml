global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/api_alerts.yml

scrape_configs:
  - job_name: shop-api
    static_configs:
      - targets: ["shop-api:3001"]
        labels:
          service: shop-api
