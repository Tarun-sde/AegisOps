global:
  resolve_timeout: 1m

route:
  group_by: ["alertname", "service"]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: aegisops-webhook

receivers:
  - name: aegisops-webhook
    webhook_configs:
      - url: http://api:8000/api/v1/webhooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: aegisops-demo-alertmanager-secret
